name: Evidence check
description: Verify one public claim, identify its source and denominator, and record what remains uncertain
title: "[Evidence] "
labels: ["evidence", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        One claim per issue. This is the "Evidence" contribution type from section 6 of the pack.
  - type: input
    id: target
    attributes:
      label: Issue id or section
      description: Where the claim appears. An issue id from 001 to 100, or a pack section.
      placeholder: "045, or Appendix C"
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: The claim being checked
      description: Quote it exactly.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      options:
        - Supported by the source
        - Partly supported; needs qualification
        - Not supported by the source
        - Could not be checked
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source links
      description: https links to the official or primary sources you checked, one per line.
    validations:
      required: true
  - type: textarea
    id: denominator
    attributes:
      label: Denominator and date
      description: What the figures are counted against, and the reference period. Say if the source gives none.
    validations:
      required: true
  - type: textarea
    id: uncertain
    attributes:
      label: What remains uncertain
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      description: How you checked, in a few lines.
    validations:
      required: false
  - type: input
    id: effort-availability
    attributes:
      label: Effort and availability
      description: How much time you are offering and when, chosen by you. A bounded task, not a promise of indefinite support.
      placeholder: "About two hours this month"
    validations:
      required: false
  - type: textarea
    id: privacy-needs
    attributes:
      label: Privacy needs
      description: Anything we must not publish or must handle with care, in general terms. Do not put the sensitive detail itself here; use the Private channel request form instead.
    validations:
      required: false
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: Who should check this, as a role or an organisation, not a person's contact details. Leave blank if you do not know.
    validations:
      required: false
  - type: input
    id: expected-output
    attributes:
      label: Expected output
      description: What exists when this is done, such as a corrected card, a new owner map or a reviewed translation.
    validations:
      required: false
  - type: dropdown
    id: credit
    attributes:
      label: Credit and consent preference
      options:
        - No name (default)
        - Credit my organisation by name
        - Credit me by name
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This contains no real complainant data or personal contact details.
          required: true
