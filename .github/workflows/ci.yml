name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate data, schemas and pack sections
        run: npm run validate

      - name: Run test suites
        # package.json's test script is `node --test`, which discovers tests/*.test.mjs on Node 22;
        # tests/docs.test.mjs pins the script to a form Node 22 accepts.
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Upload the generated site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          if-no-files-found: error

  reimport:
    name: Committed data matches the importer
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-run the importer into a temporary directory
        # The source document is pinned once, in package.json's "import" script. Read it from there
        # so a pack version bump (docs/how-to-reimport-the-pack.md) changes one place only.
        run: |
          src="$(node -p "require('./package.json').scripts.import.match(/content\/source\/\S+\.md/)[0]")"
          test -f "$src" || { echo "::error::package.json's import script points at a missing file: $src"; exit 1; }
          out="$(mktemp -d)"
          echo "REIMPORT_DIR=$out" >> "$GITHUB_ENV"
          python3 -I tools/import-pack.py "$src" "$out/data" "$out/pack"

      - name: Diff importer output against data/ and content/pack/
        run: |
          status=0
          diff -r "$REIMPORT_DIR/data" data || status=1
          diff -r "$REIMPORT_DIR/pack" content/pack || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::data/ or content/pack/ differs from the importer output. Do not hand-edit generated files; change the source document and run npm run import."
            exit 1
          fi
          echo "Committed data and pack sections match the importer output."
